name: "Vulnerable Pipeline (No Attestation)"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/supplychainattest-app:latest
      - name: Notify build server
        env:
          BUILD_SERVER_URL: ${{ secrets.BUILD_SERVER_URL }}
          BUILD_SERVER_TOKEN: ${{ secrets.BUILD_SERVER_TOKEN }}
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/supplychainattest-app:latest"
          DIGEST="${{ steps.push.outputs.digest }}"
          PAYLOAD=$(jq -nc --arg image "$IMAGE" --arg digest "$DIGEST" --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" --arg workflow "vulnerable.yml" --arg mode "unprotected" '{image:$image, digest:$digest, ref:$ref, sha:$sha, workflow:$workflow, mode:$mode}')
          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$BUILD_SERVER_TOKEN" | awk '{print $2}')"
          curl -fsSL -X POST "${BUILD_SERVER_URL}/webhook" -H "Content-Type: application/json" -H "X-Hub-Signature-256: ${SIGNATURE}" -d "$PAYLOAD"
