services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: attestgate
      POSTGRES_USER: attestgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - attestgate-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attestgate -d attestgate"]
      interval: 5s
      timeout: 3s
      retries: 20

  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    environment:
      PORT: 4100
      DATABASE_URL: postgres://attestgate:${POSTGRES_PASSWORD}@database:5432/attestgate
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?Set GITHUB_OAUTH_CLIENT_ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?Set GITHUB_OAUTH_CLIENT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COSIGN_TIMEOUT_MS: 15000
    ports:
      - "4100:4100"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  attestgate-postgres:
